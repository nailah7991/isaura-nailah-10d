<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terima Kasih | Saura Book Store</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        /* PAKSA WARNA KREM & HITAM */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #f4f1ea !important;
            font-family: 'Poppins', sans-serif;
            color: #1a1a1a !important;
            padding-top: 110px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* --- NAVIGASI LENGKAP --- */
        nav {
            background-color: #f4f1ea !important;
            position: fixed;
            top: 0; width: 100%;
            z-index: 1000;
            border-bottom: 1px solid rgba(139, 115, 91, 0.3);
        }

        .nav-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            font-weight: 700;
            text-decoration: none;
            color: #1a1a1a !important;
        }

        .logo span { color: #8b735b !important; font-style: italic; font-weight: 400; }

        .nav-links a {
            text-decoration: none;
            color: #1a1a1a !important;
            margin-left: 15px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* --- BOX KONFIRMASI --- */
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .confirm-card {
            background: #ffffff !important;
            max-width: 500px;
            width: 100%;
            padding: 50px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border: 1px solid #dcd7ca;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            margin-bottom: 15px;
            color: #1a1a1a !important;
        }

        p { color: #666; margin-bottom: 30px; }

        .btn-back {
            display: inline-block;
            background-color: #1a1a1a !important;
            color: #ffffff !important;
            text-decoration: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn-back:hover {
            background-color: #8b735b !important;
            transform: translateY(-2px);
        }

        footer { text-align: center; padding: 40px; color: #777; font-size: 0.8rem; }
    </style>
</head>
<body>

<nav>
    <div class="nav-container">
        <a href="index.html" class="logo">SAURA <span>BOOK STORE</span></a>

    </div>
</nav>

        <h1>Terima Kasih! ✨</h1>
        <p>Ulasan kamu sudah kami terima. Terima kasih sudah menjadi bagian dari perjalanan Saura Book Store.</p>
        <a href="tampil-testimoni.html" class="btn-back">Lihat Semua Ulasan &rarr;</a>
    </div>

<footer>
    <p>&copy; 2026 Saura Book Store | Crafting Stories with Heart ❤️</p>
