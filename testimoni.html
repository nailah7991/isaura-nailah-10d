    <style>
        /* PAKSA WARNA KREM & HITAM - ANTI UNGU */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #f4f1ea !important; /* Krem Kertas */
            font-family: 'Poppins', sans-serif;
            color: #1a1a1a !important;
            padding-top: 110px;
            line-height: 1.6;
        }

        /* --- NAVIGASI LENGKAP AESTHETIC --- */
        nav {
            background-color: #f4f1ea !important;
            position: fixed;
            top: 0; width: 100%;
            z-index: 1000;
            border-bottom: 1px solid rgba(139, 115, 91, 0.3);
        }

        .nav-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            font-weight: 700;
            text-decoration: none;
            color: #1a1a1a !important;
        }

        .logo span { color: #8b735b !important; font-style: italic; font-weight: 400; }

        .nav-links a {
            text-decoration: none;
            color: #1a1a1a !important;
            margin-left: 15px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .nav-links a:hover, .nav-links a.active { color: #8b735b !important; }

        /* --- FORM TESTIMONI --- */
        .container { max-width: 700px; margin: 0 auto; padding: 20px; }

        .form-card {
            background: #ffffff !important;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border: 1px solid #dcd7ca;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #1a1a1a !important;
        }

        p.subtitle { text-align: center; color: #666; margin-bottom: 30px; }

        .form-group { margin-bottom: 20px; }

        label { display: block; margin-bottom: 8px; font-weight: 600; color: #1a1a1a; font-size: 0.9rem; }

        input, textarea {
            width: 100%;
            padding: 14px;
            border: 1px solid #dcd7ca;
            background-color: #fafaf8;
            border-radius: 10px;
            font-family: 'Poppins', sans-serif;
            transition: 0.3s;
        }

        input:focus, textarea:focus { border-color: #8b735b; outline: none; background: #fff; }

        /* --- TOMBOL KIRIM HITAM ELEGAN --- */
        .btn-kirim {
            background-color: #1a1a1a !important;
            color: #ffffff !important;
            padding: 16px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-weight: 600;
            margin-top: 10px;
            transition: 0.3s;
        }

        .btn-kirim:hover { background-color: #8b735b !important; transform: translateY(-2px); }

        footer { text-align: center; padding: 40px; color: #777; font-size: 0.8rem; }

        @media (max-width: 768px) { .nav-links { display: none; } }
    </style>
