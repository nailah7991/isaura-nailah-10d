<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testimoni | Saura Book Store</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        /* PAKSA WARNA AGAR TIDAK JADI UNU LAGI */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #f4f1ea !important; /* Krem Kertas */
            font-family: 'Poppins', sans-serif;
            color: #1a1a1a !important; /* Teks Hitam */
            padding-top: 100px;
            line-height: 1.6;
        }

        /* --- NAVIGASI AESTHETIC --- */
        nav {
            background-color: #f4f1ea !important;
            position: fixed;
            top: 0; width: 100%;
            z-index: 1000;
            border-bottom: 1px solid rgba(139, 115, 91, 0.3);
        }

        .nav-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            font-weight: 700;
            text-decoration: none;
            color: #1a1a1a !important;
        }

        .logo span { color: #8b735b !important; font-style: italic; font-weight: 400; }

        .nav-links a {
            text-decoration: none;
            color: #1a1a1a !important;
            margin-left: 15px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .nav-links a.active { color: #8b735b !important; }

        /* --- FORMULIR --- */
        .container { max-width: 800px; margin: 0 auto; padding: 20px; }

        h1 {
            font-family: 'Playfair Display', serif;
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 40px;
            color: #1a1a1a !important;
        }

        .formulir {
            background: #ffffff !important;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border: 1px solid #dcd7ca;
        }

        .formulir h2 {
            font-family: 'Playfair Display', serif;
            margin-bottom: 30px;
            text-align: center;
            color: #1a1a1a !important;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #1a1a1a !important;
        }

        input, textarea {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 20px;
            border: 1px solid #dcd7ca;
            background-color: #fafaf8;
            border-radius: 10px;
            font-family: 'Poppins', sans-serif;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #8b735b;
            background-color: #fff;
        }

        button {
            background-color: #1a1a1a !important; /* Tombol Hitam */
            color: #ffffff !important;
            padding: 16px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-weight: 600;
            transition: 0.3s;
        }

        button:hover { background-color: #8b735b !important; }

        footer { text-align: center; padding: 40px; color: #777; font-size: 0.85rem; }

        @media (max-width: 768px) { .nav-links { display: none; } }
    </style>
</head>
<body>

<nav>
    <div class="nav-container">
        <a href="index.html" class="logo">SAURA <span>BOOK STORE</span></a>
        <div class="nav-links">
            <a href="index.html">beranda</a>
            <a href="produk.html">katalog</a>
            <a href="bedahbuku.html">bedah buku</a>
            <a href="testimoni.html" class="active">testimoni</a>
            <a href="tampil-testimoni.html">ulasan pembeli</a>
            <a href="kontak.html">kontak</a>
            <a href="event.html">event</a>
        </div>
    </div>
</nav>

<div class="container">
    <h1>Saura Book Store</h1>

    <main class="formulir">
        <h2>✨ Berikan Testimoni Anda</h2>
        <form id="formtestimoni">
            <label for="nama">Nama Lengkap</label>
            <input type="text" id="nama" required placeholder="Contoh: Cessalie">
            
            <label for="asal">Asal Sekolah / Instansi</label>
            <input type="text" id="asal" required placeholder="SMA Negeri 1">

            <label for="judul">Judul Buku yang Dibeli</label>
            <input type="text" id="judul" required placeholder="Judul Novel">

            <label for="rating">Rating (1-5)</label>
            <input type="number" id="rating" min="1" max="5" required> 

            <label for="pesan">Ceritakan Pengalamanmu</label>
            <textarea id="pesan" required rows="5"></textarea>

            <label for="email">Alamat Email</label>
            <input type="email" id="email" required>

            <button type="submit">Kirim Testimoni Sekarang 🚀</button>
        </form>
    </main>
</div>

<footer>
    <p>&copy; 2026 Saura Book Store | Crafting Stories with Heart</p>
</footer>

<script>
    document.getElementById('formtestimoni').addEventListener('submit', function(e) {
        e.preventDefault();

        const dataBaru = {
            nama: document.getElementById('nama').value,
            asal: document.getElementById('asal').value,
            judul: document.getElementById('judul').value,
            rating: document.getElementById('rating').value,
            pesan: document.getElementById('pesan').value,
            email: document.getElementById('email').value
        };

        let testimoniList = JSON.parse(localStorage.getItem('testimoniList')) || [];
        testimoniList.push(dataBaru);
        localStorage.setItem('testimoniList', JSON.stringify(testimoniList));

        alert('Terima kasih, Cessalie! Testimoni sudah tersimpan.');
        window.location.href = 'tampil-testimoni.html'; 
    });
</script>

</body>
</html>
