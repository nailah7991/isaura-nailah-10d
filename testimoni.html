        /* RESET & THEME */
        * {

            padding: 0;
            box-sizing: border-box;

        nav {
            background-color: #f4f1ea !important;

        }

        .nav-container {
            max-width: 1100px;

            padding: 15px 20px;

        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            font-weight: 700;
            text-decoration: none;

        }

        .logo span { color: #8b735b !important; font-style: italic; }

        .nav-links a {

            font-weight: 600;
            text-transform: uppercase;
        }

        .nav-links a.active { color: #8b735b !important; }

        /* --- FORMULIR LENGKAP --- */

        }

        .header-title {

        }

        .header-title h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .formulir-box {
            background: #ffffff !important;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);

        }

        .formulir-box h2 {
            font-family: 'Playfair Display', serif;
            text-align: center;
            margin-bottom: 30px;
            color: #1a1a1a !important;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #1a1a1a !important;
        }

        input, textarea {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #dcd7ca;
            background-color: #fafaf8;
            border-radius: 10px;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            transition: 0.3s;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #8b735b;
            background-color: #ffffff;
        }
