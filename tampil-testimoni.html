<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ulasan Pembeli | Saura Book Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #f4f1ea; font-family: 'Poppins', sans-serif; padding-top: 110px; }
        nav { background-color: #f4f1ea; position: fixed; top: 0; width: 100%; z-index: 1000; border-bottom: 1px solid rgba(139, 115, 91, 0.3); }
        .nav-container { max-width: 1100px; margin: 0 auto; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-family: 'Playfair Display', serif; font-size: 1.4rem; font-weight: 700; text-decoration: none; color: #1a1a1a; }
        .nav-links a { text-decoration: none; color: #1a1a1a; margin-left: 15px; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; }
        
        .container { max-width: 800px; margin: 0 auto; padding: 20px; }
        h1 { font-family: 'Playfair Display', serif; text-align: center; margin-bottom: 40px; }
        
        .ulasan-item { background: #fff; padding: 25px; border-radius: 15px; border: 1px solid #dcd7ca; margin-bottom: 20px; }
        .ulasan-item h3 { color: #8b735b; margin-bottom: 5px; }
        .ulasan-item .meta { font-size: 0.85rem; color: #777; margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .ulasan-item .bintang { color: #ffc451; font-size: 1.2rem; margin-top: 10px; }
    </style>
</head>
<body>
    <nav>
        <div class="nav-container">
            <a href="index.html" class="logo">SAURA BOOK STORE</a>
            <div class="nav-links">
                <a href="index.html">beranda</a>
                <a href="testimoni.html">kirim ulasan</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <h1>Apa Kata Mereka?</h1>
        <div id="listUlasan"></div>
    </div>

    <script>
        function tampilkan() {
            const list = document.getElementById('listUlasan');
            const data = JSON.parse(localStorage.getItem('saura_db')) || [];
            if (data.length === 0) {
                list.innerHTML = "<p style='text-align:center;'>Belum ada ulasan pembeli.</p>";
                return;
            }
            list.innerHTML = data.map(u => `
                <div class="ulasan-item">
                    <h3>${u.judul}</h3>
                    <div class="meta">Oleh: <strong>${u.nama}</strong> (${u.asal})</div>
                    <p>"${u.pesan}"</p>
                    <div class="bintang">${'★'.repeat(u.rating)}</div>
                    <small style="color:#bbb; display:block; margin-top:10px;">Dikirim pada: ${u.waktu}</small>
                </div>
            `).join('');
        }
        window.onload = tampilkan;
    </script>
</body>
</html>
