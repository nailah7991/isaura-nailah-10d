<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Ulasan | Saura Book Store</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        /* --- RESET & THEME COLORS --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-color: #f4f1ea;    /* Krem Kertas */
            --primary-dark: #1a1a1a; /* Hitam Elegan */
            --accent-color: #8b735b;  /* Cokelat Tua */
            --text-muted: #666;
            --card-bg: #ffffff;
        }

        body {
            background-color: var(--bg-color) !important;
            font-family: 'Poppins', sans-serif;
            color: var(--primary-dark) !important;
            padding-top: 100px;
            line-height: 1.6;
        }

        /* --- NAVIGASI LENGKAP --- */
        nav {
            background-color: var(--bg-color) !important;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            border-bottom: 1px solid rgba(139, 115, 91, 0.2);
        }

        .nav-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            font-weight: 700;
            text-decoration: none;
            color: var(--primary-dark) !important;
        }

        .logo span {
            color: var(--accent-color) !important;
            font-weight: 400;
            font-style: italic;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--primary-dark) !important;
            margin-left: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--accent-color) !important;
        }

        /* --- KONTEN UTAMA --- */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px;
        }

        h2 {
            font-family: 'Playfair Display', serif;
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 40px;
            color: var(--primary-dark) !important;
        }

        /* --- GRID TESTIMONI --- */
        #daftarTestimoni {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
            margin-bottom: 50px;
        }

        .testimoni-box {
            background: var(--card-bg) !important;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border: 1px solid rgba(139, 115, 91, 0.1);
            transition: 0.3s;
        }

        .testimoni-box:hover {
            transform: translateY(-5px);
            border-color: var(--accent-color);
        }

        .testimoni-box p {
            margin-bottom: 10px;
            font-size: 0.95rem;
        }

        .testimoni-box strong {
            color: var(--accent-color) !important;
            font-weight: 600;
        }

        .pesan-text {
            font-style: italic;
            color: #444 !important;
            padding: 15px;
            background: #fafaf8;
            border-left: 3px solid var(--accent-color);
            border-radius: 0 10px 10px 0;
            margin-top: 20px !important;
            font-family: 'Playfair Display', serif;
        }

        /* --- TOMBOL AKSI --- */
        .action-buttons {
            text-align: center;
            margin: 50px 0;
        }

        #hapusSemua {
            background-color: transparent;
            color: #d9534f;
            border: 1px solid #d9534f;
            padding: 12px 30px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: 0.3s;
        }

        #hapusSemua:hover {
            background-color: #d9534f;
            color: white;
        }

        footer {
            text-align: center;
            padding: 40px 0;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        @media (max-width: 768px) {
            .nav-links { display: none; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="nav-container">
            <a href="index.html" class="logo">SAURA <span>BOOK STORE</span></a>
            <div class="nav-links">
                <a href="index.html">beranda</a>
                <a href="produk.html">katalog</a>
                <a href="bedahbuku.html">bedah buku</a>
                <a href="testimoni.html">testimoni</a>
                <a href="tampil-testimoni.html" class="active">ulasan pembeli</a>
                <a href="kontak.html">kontak</a>
                <a href="event.html">event</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <h2>✨ Kata Mereka Tentang Saura</h2>
        
        <div id="daftarTestimoni">
            </div>

        <div class="action-buttons">
            <button id="hapusSemua">🗑️ Bersihkan Semua Ulasan</button>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Saura Book Store | Crafting Stories with Heart ❤️</p>
    </footer>

    <script>
        const container = document.getElementById('daftarTestimoni');
        const testimoniList = JSON.parse(localStorage.getItem('testimoniList')) || [];

        if (testimoniList.length === 0) {
            container.innerHTML = `
                <div style="grid-column: 1/-1; text-align: center; padding: 50px; color: #666;">
                    <p style="font-size: 1.1rem; font-style: italic;">Belum ada testimoni nih. Ayo jadi yang pertama memberi ulasan!</p>
                </div>`;
        } else {
            testimoniList.forEach((t) => {
                const el = document.createElement('div');
                el.className = 'testimoni-box';
                el.innerHTML = `
                    <p><strong>👤 Nama</strong>: ${t.nama}</p>
                    <p><strong>🏫 Asal</strong>: ${t.asal}</p>
                    <p><strong>📖 Buku</strong>: ${t.judul}</p>
                    <p><strong>⭐ Rating</strong>: <span style="color: #8b735b; font-weight:bold;">${t.rating}/5</span></p>
                    <p class="pesan-text">"${t.pesan}"</p>
                `;
                container.appendChild(el);
            });
        }

        document.getElementById("hapusSemua").addEventListener("click", function(){
            const yakin = confirm("Cessalie, yakin ingin menghapus semua ulasan ini?");
            if (yakin) {
                localStorage.removeItem("testimoniList");
                location.reload();
            }
        });
    </script>

</body>
</html>
