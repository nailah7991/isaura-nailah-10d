<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda & Event | Saura Book Store</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        /* RESET & DASAR - TEMA KREM & HITAM */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #f4f1ea !important; /* Krem Kertas */
            font-family: 'Poppins', sans-serif;
            color: #1a1a1a !important;
            padding-top: 110px;
            line-height: 1.6;
        }

        /* --- NAVIGASI LENGKAP & RAPI --- */
        nav {
            background-color: #f4f1ea !important;
            position: fixed;
            top: 0; width: 100%;
            z-index: 1000;
            border-bottom: 1px solid rgba(139, 115, 91, 0.3);
        }

        .nav-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            font-weight: 700;
            text-decoration: none;
            color: #1a1a1a !important;
        }

        .logo span { color: #8b735b !important; font-style: italic; font-weight: 400; }

        .nav-links a {
            text-decoration: none;
            color: #1a1a1a !important;
            margin-left: 15px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .nav-links a:hover, .nav-links a.active { color: #8b735b !important; }

        /* --- HEADER --- */
        header {
            text-align: center;
            margin-bottom: 50px;
            padding: 0 20px;
        }

        header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            color: #1a1a1a;
            margin-bottom: 10px;
        }

        header p {
            color: #666;
            font-style: italic;
        }

        /* --- EVENT CARDS --- */
        .container-content {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .event-card {
            background: #ffffff !important;
            padding: 30px;
            border-radius: 20px;
            margin-bottom: 30px;
            display: flex;
            gap: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border: 1px solid #dcd7ca;
            transition: 0.3s ease;
            align-items: center;
        }

        .event-card:hover {
            transform: translateY(-5px);
            border-color: #8b735b;
        }

        /* Kotak Tanggal Hitam Elegan */
        .event-date {
            background: #1a1a1a !important;
            color: #ffffff !important;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            min-width: 100px;
        }
