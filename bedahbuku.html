    <title>Bedah Buku | Saura Book Store</title>

    <style>
        /* RESET & PENGATURAN WARNA UTAMA */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f4f1ea !important; /* Krem Aesthetic */
            font-family: 'Poppins', sans-serif;
            color: #1a1a1a !important; /* Pastikan teks HITAM */
            padding-top: 100px;
            line-height: 1.6;
        }

        /* --- NAVIGASI (DENGAN CONTAINER) --- */
        nav {
            background-color: #f4f1ea !important;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 9999;
            border-bottom: 1px solid #dcd7ca;
        }

        .nav-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            color: #1a1a1a !important;
            text-decoration: none;
            font-weight: bold;
        }

        .logo span {
            color: #8b735b !important; /* Cokelat Aesthetic */
        }

        .nav-links a {
            text-decoration: none;
            color: #1a1a1a !important;
            margin-left: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            transition: 0.3s;
        }

        .nav-links a.active {
            color: #8b735b !important;
        }

        /* --- KONTEN BEDAH BUKU --- */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px;
        }

        .page-header {
            text-align: center;
            margin-bottom: 50px;
        }

        .page-header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.8rem;
            color: #1a1a1a !important;
            margin-bottom: 10px;
        }

        /* GRID KARTU BUKU */
        .grid-bedah {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .book-card {
            background: #ffffff !important;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border: 1px solid #dcd7ca;
            transition: 0.3s;
            display: flex;
            flex-direction: column;
        }

        .book-card:hover {
            transform: translateY(-10px);
        }

        .card-image img {
            width: 100%;
            height: 350px;
            object-fit: cover;
        }

        .card-content {
            padding: 25px;
        }

        .genre-tag {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #8b735b !important;
            margin-bottom: 10px;
            display: block;
        }

            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: #1a1a1a !important;
        }
