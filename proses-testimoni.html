<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terima Kasih | Saura Book Store</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        /* --- RESET & THEME COLORS --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-color: #f4f1ea;    /* Krem Kertas */
            --primary-dark: #1a1a1a; /* Hitam Elegan */
            --accent-color: #8b735b;  /* Cokelat Tua */
            --text-muted: #666;
            --card-bg: #ffffff;
        }

        body {
            background-color: var(--bg-color) !important;
            font-family: 'Poppins', sans-serif;
            color: var(--primary-dark) !important;
            padding-top: 100px;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* --- NAVIGASI LENGKAP --- */
        nav {
            background-color: var(--bg-color) !important;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            border-bottom: 1px solid rgba(139, 115, 91, 0.2);
        }

        .nav-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            font-weight: 700;
            text-decoration: none;
            color: var(--primary-dark) !important;
        }

        .logo span {
            color: var(--accent-color) !important;
            font-weight: 400;
            font-style: italic;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--primary-dark) !important;
            margin-left: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: var(--accent-color) !important;
        }

        /* --- BAGIAN UTAMA --- */
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .konfirmasi-box {
            background: var(--card-bg) !important;
            max-width: 600px;
            width: 100%;
            padding: 50px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border: 1px solid rgba(139, 115, 91, 0.1);
        }

        .konfirmasi-box h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            color: var(--primary-dark) !important;
            margin-bottom: 15px;
        }

        .konfirmasi-box p {
            color: var(--text-muted);
            margin-bottom: 30px;
            font-size: 1.1rem;
        }

        /* --- TOMBOL AESTHETIC --- */
        .btn-link {
            display: inline-block;
            background-color: var(--primary-dark) !important;
            color: #ffffff !important;
            text-decoration: none;
            padding: 15px 35px;
            border-radius: 50px;
            font-weight: 600;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .btn-link:hover {
            background-color: var(--accent-color) !important;
            transform: translateY(-2px);
        }

        /* --- FOOTER --- */
        footer {
            text-align: center;
            padding: 30px 0;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        @media (max-width: 768px) {
            .nav-links { display: none; }
            .konfirmasi-box { padding: 30px; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="nav-container">
            <a href="index.html" class="logo">SAURA <span>BOOK STORE</span></a>
            <div class="nav-links">
                <a href="index.html">beranda</a>
                <a href="produk.html">katalog</a>
                <a href="bedahbuku.html">bedah buku</a>
                <a href="testimoni.html">testimoni</a>
                <a href="tampil-testimoni.html">ulasan pembeli</a>
                <a href="kontak.html">kontak</a>
                <a href="event.html">event</a>
            </div>
        </div>
    </nav>

    <main>
        <section class="konfirmasi-box">
            <h1>Terima Kasih! ✨</h1>
            <p>Testimoni kamu telah berhasil terkirim dan sangat berarti bagi Saura Book Store.</p>
            <a href="tampil-testimoni.html" class="btn-link">Lihat semua ulasan &rarr;</a>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Saura Book Store | Crafting Stories with Heart ❤️</p>
    </footer>

</body>
</html>
