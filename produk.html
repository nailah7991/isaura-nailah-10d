<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produk | Saura Book Store</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        /* --- CSS INTERNAL (PASTI TERBACA) --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #f4f1ea !important; /* WARNA KREM */
            font-family: 'Poppins', sans-serif;
            color: #1a1a1a;
            padding-top: 100px;
        }

        /* NAVBAR CONTAINER */
        nav {
            background-color: #f4f1ea;
            position: fixed;
            top: 0; width: 100%;
            z-index: 1000;
            border-bottom: 1px solid rgba(139, 115, 91, 0.2);
        }

        .nav-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            font-weight: 700;
            text-decoration: none;
            color: #1a1a1a;
        }

        .logo span { color: #8b735b; font-style: italic; font-weight: 400; }

        .nav-links a {
            text-decoration: none;
            color: #1a1a1a;
            margin-left: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .nav-links a.active { color: #8b735b; }

        /* PRODUK SECTION */
        .daftar-produk {
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px;
        }

        .produk-card {
            background: #ffffff;
            border-radius: 20px;
            display: flex;
            margin-bottom: 30px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border: 1px solid rgba(139, 115, 91, 0.1);
        }

        .produk-image { width: 250px; flex-shrink: 0; }
        .produk-image img { width: 100%; height: 100%; object-fit: cover; }

        .produk-info { padding: 30px; }
        .produk-info h2 { font-family: 'Playfair Display', serif; margin-bottom: 10px; }
        .harga { color: #8b735b; font-weight: 600; font-size: 1.2rem; margin-bottom: 10px; }
        .deskripsi { font-size: 0.9rem; color: #555; margin-bottom: 20px; }

        .btn-beli {
            background: #1a1a1a;
            color: white;
            padding: 10px 25px;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .produk-card { flex-direction: column; }
            .produk-image { width: 100%; height: 300px; }
            .nav-links { display: none; }
        }
    </style>
</head>
<body>

<nav>
    <div class="nav-container">
        <a href="index.html" class="logo">Saura <span>Book Store</span></a>
        <div class="nav-links">
            <a href="index.html">Beranda</a>
            <a href="produk.html" class="active">Produk</a>
            <a href="bedahbuku.html">Bedah Buku</a>
            <a href="testimoni.html">Testimoni</a>
            <a href="tampil-testimoni.html">Pembeli</a>
            <a href="kontak.html">Kontak</a>
            <a href="event.html">Event</a>
        </div>
    </div>
</nav>

<section class="daftar-produk">
    <div class="produk-card">
        <div class="produk-image">
            <img src="https://upload.wikimedia.org/wikipedia/id/0/00/A_Beautiful_Crime_book_cover.jpg" alt="A Beautiful Crime">
        </div>
        <div class="produk-info">
            <h2>A Beautiful Crime</h2>
            <p class="harga">Rp128.000</p>
            <p class="deskripsi">Kisah sepasang kekasih di dunia sosial kelas atas Venesia yang penuh intrik dan kemewahan.</p>
            <button class="btn-beli">Beli Sekarang</button>
        </div>
    </div>
    
    </section>

</body>
</html>
