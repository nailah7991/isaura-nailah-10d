<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produk | Saura Book Store</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        /* --- RESET & THEME COLORS --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-color: #f4f1ea;    /* Krem Kertas */
            --primary-dark: #1a1a1a; /* Hitam Elegan */
            --accent-color: #8b735b;  /* Cokelat Tua Aesthetic */
            --text-muted: #666;
            --card-bg: #ffffff;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Poppins', sans-serif;
            color: var(--primary-dark);
            padding-top: 100px;
            line-height: 1.6;
        }

        /* --- NAVIGATION (SAME AS HOME/BEDAH BUKU) --- */
        nav {
            background-color: var(--bg-color);
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            border-bottom: 1px solid rgba(139, 115, 91, 0.2);
        }

        .nav-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            font-weight: 700;
            text-decoration: none;
            color: var(--primary-dark);
        }

        .logo span {
            color: var(--accent-color);
            font-weight: 400;
            font-style: italic;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--primary-dark);
            margin-left: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--accent-color);
        }

        /* --- HEADER --- */
        .page-header {
            text-align: center;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .page-header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .page-header p {
            color: var(--text-muted);
            font-style: italic;
        }

        /* --- DAFTAR PRODUK (GRID) --- */
        .daftar-produk {
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr; /* List view untuk deskripsi panjang */
            gap: 40px;
        }

        .produk-card {
            background: var(--card-bg);
            border-radius: 20px;
            display: flex; /* Horizontal Layout */
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border: 1px solid rgba(139, 115, 91, 0.1);
            transition: 0.4s;
        }

        .produk-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(139, 115, 91, 0.15);
        }

        .produk-image {
            width: 300px;
            flex-shrink: 0;
            overflow: hidden;
        }

        .produk-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
