<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produk | Saura Book Store</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <style>
        /* PAKSA WARNA AGAR MUNCUL */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f4f1ea !important; /* Krem Kertas */
            font-family: 'Poppins', sans-serif;
            color: #1a1a1a !important; /* PAKSA TEKS HITAM */
            padding-top: 100px;
        }

        /* --- NAVIGATION (CONTAINER) --- */
        nav {
            background-color: #f4f1ea !important;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 9999;
            border-bottom: 2px solid #8b735b;
        }

        .nav-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            color: #1a1a1a !important;
            text-decoration: none;
            font-weight: bold;
        }

        .logo span {
            color: #8b735b !important;
        }

        .nav-links a {
            text-decoration: none;
            color: #1a1a1a !important; /* PAKSA HITAM */
            margin-left: 15px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .nav-links a:hover, .nav-links a.active {
            color: #8b735b !important;
        }

        /* --- KATALOG PRODUK --- */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            text-align: center;
            margin-bottom: 40px;
            color: #1a1a1a !important;
        }

        .produk-card {
            background: #ffffff !important;
            border-radius: 15px;
            display: flex;
            margin-bottom: 30px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border: 1px solid #dcd7ca;
        }

        .produk-image {
            width: 250px;
            flex-shrink: 0;
        }

        .produk-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .produk-info {
            padding: 30px;
            color: #1a1a1a !important;
        }

        .produk-info h2 {
            font-family: 'Playfair Display', serif;
            margin-bottom: 10px;
            color: #1a1a1a !important;
        }

        .harga {
            color: #8b735b !important;
            font-weight: bold;
            font-size: 1.3rem;
            margin-bottom: 15px;
            display: block;
        }

        .deskripsi {
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 20px;
            color: #444 !important;
        }

        .btn-beli {
            background-color: #1a1a1a !important;
            color: #ffffff !important;
            padding: 12px 30px;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn-beli:hover {
            background-color: #8b735b !important;
        }

        /* Responsive Mobile */
        @media (max-width: 768px) {
            .produk-card { flex-direction: column; }
            .produk-image { width: 100%; height: 300px; }
            .nav-links { display: none; }
        }
    </style>
</head>
<body>

                <a href="kontak.html">Kontak</a>
                <a href="event.html">Event</a>
            </div>
        </div>
    </nav>
